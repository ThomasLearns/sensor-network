profiles:
  uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.6)
    libraries:
      # needed for XbeeRadio
      - dir: ../libraries/XbeeRadio
      - XBee-Arduino library (0.6.0)
      - AltSoftSerial (1.4.0)
      # needed for JammerButton
      - dir: ../libraries/JammerButton
      - dir: ../libraries/PacketTypes
      
default_profile: uno
